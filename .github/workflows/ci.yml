name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 20.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  # (Optional) Add a changes detection step later if needed
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            node_modules/.cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s','**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package-lock.json') }}-

      - name: Apply labels from paths (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto label from branch (PR only)
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${GITHUB_HEAD_REF}"
          add_label() { echo "Adding label $1"; gh pr edit $PR --add-label "$1" || true; }
          PR=${{ github.event.pull_request.number }}
          if [[ "$BRANCH" == feature/* || "$BRANCH" == feat/* ]]; then add_label feature; fi
          if [[ "$BRANCH" == fix/* || "$BRANCH" == bug/* ]]; then add_label bug; fi
          if [[ "$BRANCH" == docs/* ]]; then add_label docs; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto assign maintainer (PR only)
        if: github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} --add-assignee n2flowjs-bot || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --silent

      - name: Build
        run: npm run build --if-present


      - name: Configure Pages (main only)
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Upload artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next

      - name: Upload Pages artifact (main only)
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to Pages (main only)
        if: github.event_name == 'push'
        uses: actions/deploy-pages@v4
        id: deployment

  # Removed docs-only skip notice after simplifying conditions

      - name: Create issue on failure
        if: failure() && github.event_name == 'push'
        uses: peter-evans/create-issue-from-file@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          title: "🚨 CI Build Failed"
          content-filepath: .github/ISSUE_TEMPLATE/build_failed.md
          labels: bug, ci

  issue-auto-label:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Add labels based on title
        run: |
          TITLE="${{ github.event.issue.title }}"
          NUMBER=${{ github.event.issue.number }}
          add_label() { echo "Adding $1"; gh issue edit $NUMBER --add-label "$1" || true; }
          shopt -s nocasematch
          [[ $TITLE == *bug* || $TITLE == *fix* ]] && add_label bug
          [[ $TITLE == *feature* || $TITLE == *feat* ]] && add_label feature
          [[ $TITLE == *docs* || $TITLE == *documentation* ]] && add_label docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto assign maintainer
        run: gh issue edit ${{ github.event.issue.number }} --add-assignee n2flowjs-bot || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
