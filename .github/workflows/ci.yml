name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm run install:all

    - name: Generate Prisma Client
      run: npm --prefix back-end run db:generate

    - name: Type check
      run: npm run type-check

    - name: Build
      run: npm run build

    - name: Run Backend Tests
      run: npm --prefix back-end run test -- --run

    - name: Run Frontend Tests
      run: npm --prefix front-end run test -- --run
