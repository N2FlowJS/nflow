name: "🐞 Bug report"
description: Report a reproducible bug
title: "bug: short description"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug. Please provide clear, concise details so we can reproduce and fix it quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the bug.
      placeholder: e.g. Build fails when running npm run build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List each step needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / Logs
      placeholder: Paste error message, logs, or stack trace.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit SHA
      placeholder: e.g. v0.4.2 or a1b2c3d
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
